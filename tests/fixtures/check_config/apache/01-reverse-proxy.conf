# Rendered Apache configuration (deployment/apache) for the fixture topology.
# Commented examples such as ProxyPass / http://api:8000/ are ignored.
<VirtualHost *:8080>
    ServerName pathocore.example.org
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass / http://pathocore-web:3000/
    ProxyPassReverse / http://pathocore-web:3000/
</VirtualHost>

<VirtualHost *:8080>
    ServerName api.example.org
    ProxyPreserveHost On
    ProxyPass / http://pathocore-api:8301/
</VirtualHost>

<VirtualHost *:8080>
    ServerName auth.example.org
    ProxyPreserveHost On
    ProxyPass / http://pathocore-web-keycloak:8080/
</VirtualHost>

<VirtualHost *:8080>
    ServerName omop.example.org
    ProxyPreserveHost Off
    ProxyPass / http://mepram-omop-api:8004/
</VirtualHost>
