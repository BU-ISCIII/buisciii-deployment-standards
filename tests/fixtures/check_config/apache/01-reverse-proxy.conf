# Rendered Apache configuration (deployment/apache) for the fixture topology.
# Commented examples such as ProxyPass / http://api:8000/ are ignored.
<VirtualHost *:8080>
    ServerName app.example.org
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass / http://example-web:3000/
    ProxyPassReverse / http://example-web:3000/
</VirtualHost>

<VirtualHost *:8080>
    ServerName api.example.org
    ProxyPreserveHost On
    ProxyPass / http://example-api:8301/
</VirtualHost>

<VirtualHost *:8080>
    ServerName auth.example.org
    ProxyPreserveHost On
    ProxyPass / http://example-web-keycloak:8080/
</VirtualHost>

<VirtualHost *:8080>
    ServerName second-api.example.org
    ProxyPreserveHost Off
    ProxyPass / http://second-api:8004/
</VirtualHost>
