# Reduced topology with the OIDC environment generated by the Keycloak add-on.
services:
  example-web:
    image: example-web:local
    networks: [deployment_net]

  example-api:
    image: example-api:local
    environment:
      DB_HOST: ${EXAMPLE_API_DB_HOST:?required}
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}/realms/${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}/protocol/openid-connect/certs
    networks: [deployment_net]

  example-api-db:
    image: docker.io/library/mysql:8.0
    expose: ["3306"]
    networks: [deployment_net]

  second-api:
    image: second-api:local
    environment:
      DB_HOST: ${SECOND_API_DB_HOST:?required}
    networks: [deployment_net]

  example-web-keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    expose: ["8080"]
    networks:
      deployment_net:
        aliases: [keycloak]

networks:
  deployment_net:
    driver: bridge
