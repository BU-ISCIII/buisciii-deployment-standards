# Reduced production topology in the shape generated by scripts/scaffold.py:
# a Next.js frontend, two Django APIs (one with a Compose-managed database,
# one using an external database), Keycloak and Apache.
services:
  # BEGIN BU-ISCIII SERVICE: pathocore-web (nextjs)
  pathocore-web:
    image: "${PATHOCORE_WEB_IMAGE:-pathocore-web:local}"
    environment:
      PATHOCORE_API_PROXY_TARGET: ${PATHOCORE_WEB_PATHOCORE_API_PROXY_TARGET:?required}
      MEPRAM_OMOP_API_PROXY_TARGET: ${PATHOCORE_WEB_MEPRAM_OMOP_API_PROXY_TARGET:?required}
    ports:
      - "127.0.0.1:${PATHOCORE_WEB_APP_PORT:?required}:${PATHOCORE_WEB_APP_PORT:?required}"
    networks: [deployment_net]
  # END BU-ISCIII SERVICE: pathocore-web

  pathocore-api:
    image: "${PATHOCORE_API_IMAGE:-pathocore-api:local}"
    environment:
      DB_HOST: ${PATHOCORE_API_DB_HOST:?required}
    networks:
      deployment_net:
        aliases:
          - pathocore-api-internal
          # Legacy underscore identity kept for older clients.
          - pathocore_api

  pathocore-api-db:
    image: docker.io/library/mysql:8.0
    expose: ["3306"]
    networks: [deployment_net]

  mepram-omop-api:
    image: "${MEPRAM_OMOP_API_IMAGE:-mepram-omop-api:local}"
    environment:
      DB_HOST: ${MEPRAM_OMOP_API_DB_HOST:?required}
    networks: [deployment_net]

  pathocore-web-keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    expose: ["8080"]
    networks: [deployment_net]

  pathocore-web-apache:
    image: registry.access.redhat.com/ubi9/httpd-24:latest
    expose:
      - "8080"
    networks: [deployment_net]

networks:
  deployment_net:
    driver: bridge

volumes:
  pathocore-api_documents:
