# Reduced production topology in the shape generated by scripts/scaffold.py:
# a Next.js frontend, two Django APIs (one with a Compose-managed database,
# one using an external database), Keycloak and Apache.
services:
  # BEGIN BU-ISCIII SERVICE: example-web (nextjs)
  example-web:
    image: "${EXAMPLE_WEB_IMAGE:-example-web:local}"
    environment:
      EXAMPLE_API_PROXY_TARGET: ${EXAMPLE_WEB_EXAMPLE_API_PROXY_TARGET:?required}
      SECOND_API_PROXY_TARGET: ${EXAMPLE_WEB_SECOND_API_PROXY_TARGET:?required}
    ports:
      - "127.0.0.1:${EXAMPLE_WEB_APP_PORT:?required}:${EXAMPLE_WEB_APP_PORT:?required}"
    networks: [deployment_net]
  # END BU-ISCIII SERVICE: example-web

  example-api:
    image: "${EXAMPLE_API_IMAGE:-example-api:local}"
    environment:
      DB_HOST: ${EXAMPLE_API_DB_HOST:?required}
    networks:
      deployment_net:
        aliases:
          - example-api-internal
          # Legacy underscore identity kept for older clients.
          - example_api

  example-api-db:
    image: docker.io/library/mysql:8.0
    expose: ["3306"]
    networks: [deployment_net]

  second-api:
    image: "${SECOND_API_IMAGE:-second-api:local}"
    environment:
      DB_HOST: ${SECOND_API_DB_HOST:?required}
    networks: [deployment_net]

  example-web-keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    expose: ["8080"]
    networks: [deployment_net]

  example-web-apache:
    image: registry.access.redhat.com/ubi9/httpd-24:latest
    expose:
      - "8080"
    networks: [deployment_net]

networks:
  deployment_net:
    driver: bridge

volumes:
  example-api_documents:
